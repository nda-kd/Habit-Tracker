<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker — Statistics</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7f5;
        color: #202421;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      .header {
        margin-bottom: 22px;
      }

      .title {
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -0.8px;
        margin: 0 0 18px;
      }

      .range-switcher {
        display: inline-flex;
        background: #e9ece8;
        padding: 4px;
        border-radius: 12px;
        gap: 2px;
      }

      .range-button {
        border: 0;
        background: transparent;
        padding: 9px 18px;
        border-radius: 9px;
        color: #747a75;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .range-button:hover {
        color: #202421;
      }

      .range-button.active {
        background: #ffffff;
        color: #202421;
        box-shadow: 0 2px 8px rgba(20, 30, 20, 0.08);
      }

      .date-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 2px 20px;
      }

      .date {
        font-size: 15px;
        font-weight: 650;
      }

      .arrow-buttons {
        display: flex;
        gap: 6px;
      }

      .arrow {
        width: 34px;
        height: 34px;
        border: 1px solid #e1e4e0;
        background: white;
        border-radius: 9px;
        cursor: pointer;
        color: #555b56;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }

      .stat-card {
        background: white;
        border: 1px solid #e8ebe7;
        border-radius: 16px;
        padding: 18px;
        min-height: 105px;
      }

      .stat-value {
        font-size: 25px;
        font-weight: 760;
        letter-spacing: -0.6px;
        margin-bottom: 7px;
      }

      .stat-label {
        color: #858b86;
        font-size: 12px;
        font-weight: 550;
      }

      .card {
        background: white;
        border: 1px solid #e8ebe7;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 14px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 15px;
        font-weight: 720;
      }

      .card-subtitle {
        font-size: 12px;
        color: #929792;
      }

      .chart {
        height: 270px;
        margin: 0 -8px;
      }

      .habit-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid #f0f2ef;
      }

      .habit-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .habit-info {
        min-width: 0;
      }

      .habit-name {
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 8px;
      }

      .progress-track {
        height: 6px;
        border-radius: 20px;
        background: #edf0ed;
        overflow: hidden;
      }

      .progress {
        height: 100%;
        border-radius: inherit;
        background: #252b27;
      }

      .habit-value {
        font-size: 12px;
        color: #737a74;
        white-space: nowrap;
        align-self: center;
      }

      .insights {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .insight {
        padding: 14px;
        background: #f7f8f6;
        border-radius: 13px;
      }

      .insight-icon {
        font-size: 16px;
        margin-bottom: 7px;
      }

      .insight-label {
        font-size: 11px;
        color: #8b918c;
        margin-bottom: 3px;
      }

      .insight-value {
        font-size: 13px;
        font-weight: 680;
      }

      .heatmap {
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .heatmap-grid {
        min-width: 620px;
      }

      .heatmap-months {
        display: grid;
        grid-template-columns: 42px repeat(12, 1fr);
        margin-bottom: 7px;
        font-size: 10px;
        color: #949a95;
      }

      .heatmap-months span {
        text-align: center;
      }

      .heatmap-row {
        display: grid;
        grid-template-columns: 42px repeat(12, 1fr);
        gap: 5px;
        margin-bottom: 5px;
      }

      .weekday {
        font-size: 10px;
        color: #8c928d;
        display: flex;
        align-items: center;
      }

      .heat-cell {
        height: 18px;
        border-radius: 4px;
        background: #edf0ed;
      }

      .level-1 {
        background: #d8dfd9;
      }
      .level-2 {
        background: #b4c3b6;
      }
      .level-3 {
        background: #78917c;
      }
      .level-4 {
        background: #3f5945;
      }

      .legend {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 5px;
        margin-top: 12px;
        color: #929892;
        font-size: 10px;
      }

      .legend .heat-cell {
        width: 14px;
        height: 14px;
      }

      .year-insights {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .year-insight {
        padding: 16px;
        border-radius: 13px;
        background: #f7f8f6;
      }

      .year-insight-value {
        font-size: 17px;
        font-weight: 730;
        margin-bottom: 4px;
      }

      .year-insight-label {
        font-size: 11px;
        color: #8b918c;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 600px) {
        .app {
          padding: 24px 14px 45px;
        }

        .title {
          font-size: 26px;
        }

        .stats-grid {
          gap: 8px;
        }

        .stat-card {
          padding: 14px;
        }

        .stat-value {
          font-size: 21px;
        }

        .insights {
          grid-template-columns: 1fr;
        }

        .year-insights {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 400px) {
        .range-button {
          padding: 8px 13px;
        }

        .stat-label {
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { ResponsiveBar, ResponsiveLine } = window.Nivo;
    </script>

    <!-- Nivo packages -->
    <script src="https://unpkg.com/@nivo/bar@0.99.0/dist/nivo-bar.umd.min.js"></script>
    <script src="https://unpkg.com/@nivo/line@0.99.0/dist/nivo-line.umd.min.js"></script>

    <script type="text/babel">

      function StatCard({ value, label }) {
        return (
          <div className="stat-card">
            <div className="stat-value">{value}</div>
            <div className="stat-label">{label}</div>
          </div>
        );
      }

      function HabitRow({ icon, name, value, percent }) {
        return (
          <div className="habit-row">
            <div className="habit-info">
              <div className="habit-name">
                {icon} {name}
              </div>

              <div className="progress-track">
                <div
                  className="progress"
                 // style={{ width: ${percent}% }}
                />
              </div>
            </div>

            <div className="habit-value">
              {value} &nbsp; {percent}%
            </div>
          </div>
        );
      }

      function WeeklyChart() {

        const data = [
          { day: "Mon", completion: 72 },
          { day: "Tue", completion: 85 },
          { day: "Wed", completion: 55 },
          { day: "Thu", completion: 100 },
          { day: "Fri", completion: 76 },
          { day: "Sat", completion: 63 },
          { day: "Sun", completion: 92 }
        ];

        return (
          <div className="chart">
            <ResponsiveBar
            data={data}
              keys={["completion"]}
              indexBy="day"
              margin={{ top: 10, right: 12, bottom: 35, left: 42 }}
              padding={0.35}
              valueScale={{ type: "linear", min: 0, max: 100 }}
              indexScale={{ type: "band", round: true }}
              colors={["#39453d"]}
              borderRadius={6}
              enableLabel={false}
              enableGridX={false}
              enableGridY={true}
              axisLeft={{
                tickValues: [0, 25, 50, 75, 100],
             //   format: value => ${value}%,
                tickSize: 0,
                tickPadding: 8
              }}
              axisBottom={{
                tickSize: 0,
                tickPadding: 10
              }}
              theme={{
                grid: {
                  line: {
                    stroke: "#eef0ed",
                    strokeWidth: 1
                  }
                },
                axis: {
                  ticks: {
                    text: {
                      fill: "#929892",
                      fontSize: 10
                    }
                  }
                }
              }}
              tooltip={({ value, indexValue }) => (
                <div style={{
                  background: "#202421",
                  color: "#fff",
                  padding: "8px 10px",
                  borderRadius: 7,
                  fontSize: 11
                }}>
                  {indexValue}: {value}%
                </div>
              )}
            />
          </div>
        );
      }

      function MonthlyChart() {

        const data = [
          {
            id: "Completion",
            data: [
              { x: "1", y: 61 },
              { x: "5", y: 68 },
              { x: "10", y: 74 },
              { x: "15", y: 72 },
              { x: "20", y: 81 },
              { x: "25", y: 87 },
              { x: "30", y: 84 }
            ]
          }
        ];

        return (
          <div className="chart">
            <ResponsiveLine
              data={data}
              margin={{ top: 15, right: 15, bottom: 35, left: 42 }}
              xScale={{ type: "point" }}
              yScale={{
                type: "linear",
                min: 0,
                max: 100,
                stacked: false
              }}
              curve="monotoneX"
              colors={["#39453d"]}
              lineWidth={3}
              enablePoints={true}
              pointSize={7}
              pointBorderWidth={2}
              pointBorderColor="#ffffff"
              enableGridX={false}
              axisLeft={{
                tickValues: [0, 25, 50, 75, 100],
              //  format: value => ${value}%,
                tickSize: 0,
                tickPadding: 8
              }}
              axisBottom={{
                tickSize: 0,
                tickPadding: 10
              }}
              enableArea={true}
              areaOpacity={0.06}
              useMesh={true}
              theme={{
                grid: {
                  line: {
                    stroke: "#eef0ed"
                  }
                },
                axis: {
                  ticks: {
                    text: {
                      fill: "#929892",
                      fontSize: 10
                    }
                  }
                }
              }}
            />
          </div>
        );
      }

      function Heatmap() {

        const months = [
          "Jan","Feb","Mar","Apr","May","Jun",
          "Jul","Aug","Sep","Oct","Nov","Dec"
        ];

        const weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

        return (
          <div className="heatmap">
            <div className="heatmap-grid">

              <div className="heatmap-months">
                <span></span>

                {months.map(month => (
                  <span key={month}>{month}</span>
                ))}
              </div>

              {weekdays.map((day, row) => (
                <div className="heatmap-row" key={day}>
                  <div className="weekday">{day}</div>

                  {months.map((month, col) => {

                    const level =
                      (row * 3 + col * 2) % 5;

                    return (
                      <div
                        key={month}
                      //  className={heat-cell ${
                       //   level === 0
                       //     ? ""
                     ///       : level-${level}
                    //    }}
                      />
                    );
                  })}
                </div>
              ))}

            </div>

            <div className="legend">
              Less

              <span className="heat-cell"></span>
              <span className="heat-cell level-1"></span>
              <span className="heat-cell level-2"></span>
              <span className="heat-cell level-3"></span>
              <span className="heat-cell level-4"></span>

              More
            </div>
          </div>
        );
      }

      function Week() {

        return (
          <>
            <div className="stats-grid">
              <StatCard value="82%" label="Completion" />
              <StatCard value="33/42" label="Completed" />
              <StatCard value="🔥 6" label="Streak" />
            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Weekly completion
                </div>

                <div className="card-subtitle">
                  Completion per day
                </div>
              </div>

              <WeeklyChart />

            </div>

            <div className="card">

              <div className="card-title">
                Your habits
              </div>

              <HabitRow
                icon="🧘"
                name="Meditation"
                value="7/7"
                percent={100}
              />

              <HabitRow
                icon="📖"
                name="Reading"
                value="6/7"
                percent={86}
              />

              <HabitRow
                icon="🏃"
                name="Exercise"
                value="5/7"
                percent={71}
              />

              <HabitRow
                icon="💧"
                name="Water"
                value="4/7"
                percent={57}
              />

            </div>

            <div className="card">

              <div className="insights">

                <div className="insight">
                  <div className="insight-icon">🏆</div>
                  <div className="insight-label">Best day</div>
                  <div className="insight-value">Saturday</div>
                </div>

                <div className="insight">
                  <div className="insight-icon">🔥</div>
                  <div className="insight-label">Best streak</div>
                  <div className="insight-value">6 days</div>
                </div>

                <div className="insight">
                  <div className="insight-icon">📈</div>
                  <div className="insight-label">vs last week</div>
                  <div className="insight-value">+8%</div>
                </div>

              </div>

            </div>
          </>
        );
      }

      function Month() {

        return (
          <>
            <div className="stats-grid">
              <StatCard value="84%" label="Completion" />
              <StatCard value="147/175" label="Completed" />
              <StatCard value="🔥 14" label="Longest streak" />
            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Completion trend
                </div>

                <div className="card-subtitle">
                  September 2026
                </div>
              </div>

              <MonthlyChart />

            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Habit consistency
                </div>
              </div>

              <HabitRow
                icon="🧘"
                name="Meditation"
                value="29/30"
                percent={96}
              />

              <HabitRow
                icon="📖"
                name="Reading"
                value="27/30"
                percent={89}
              />

              <HabitRow
                icon="🏃"
                name="Exercise"
                value="25/30"
                percent={82}
              />

              <HabitRow
                icon="💧"
                name="Water"
                value="22/30"
                percent={74}
              />

              <HabitRow
                icon="✍️"
                name="Journaling"
                value="18/30"
                percent={61}
              />

            </div>

            <div className="card">

              <div className="insights">

                <div className="insight">
                  <div className="insight-icon">🏆</div>
                  <div className="insight-label">Best day</div>
                  <div className="insight-value">
                    Sep 21 — 100%
                  </div>
                </div>

                <div className="insight">
                  <div className="insight-icon">🔥</div>
                  <div className="insight-label">Longest streak</div>
                  <div className="insight-value">
                    14 days
                  </div>
                </div>

                <div className="insight">
                  <div className="insight-icon">📈</div>
                  <div className="insight-label">Improvement</div>
                  <div className="insight-value">
                    +8%
                  </div>
                </div>

              </div>

            </div>
          </>
        );
      }

      function Year() {

        return (
          <>
            <div className="stats-grid">
              <StatCard value="81%" label="Average" />
              <StatCard value="1,842" label="Completed" />
              <StatCard value="🔥 37" label="Best streak" />
            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Consistency
                </div>

                <div className="card-subtitle">
                  2026
                </div>
              </div>

              <Heatmap />

            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Monthly progress
                </div>
              </div>

              <MonthlyChart />

            </div>

            <div className="card">

              <div className="card-header">
                <div className="card-title">
                  Your year
                </div>
              </div>

              <div className="year-insights">

                <div className="year-insight">
                  <div className="year-insight-value">
                    🏆 37 days
                  </div>
                  <div className="year-insight-label">
                    Longest streak
                  </div>
                </div>

                <div className="year-insight">
                  <div className="year-insight-value">
                    ⭐️ 11
                  </div>
                  <div className="year-insight-label">
                    Habits maintained
                  </div>
                </div>

                <div className="year-insight">
                  <div className="year-insight-value">
                    📈 +18%
                  </div>
                  <div className="year-insight-label">
                    vs last year
                  </div>
                </div>

                <div className="year-insight">
                  <div className="year-insight-value">
                    🎯 81%
                  </div>
                  <div className="year-insight-label">
                    Overall consistency
                  </div>
                </div>

              </div>

            </div>
          </>
        );
      }

      function App() {

        const [range, setRange] = React.useState("week");

        return (
          <main className="app">

            <header className="header">

              <h1 className="title">
                Statistics
              </h1>

              <div className="range-switcher">

                {["week", "month", "year"].map(item => (

                  <button
                    key={item}
                    className={
                      range-button ${
                        range === item ? "active" : ""
                      }
                    }
                    onClick={() => setRange(item)}
                  >
                    {item.toUpperCase()}
                  </button>

                ))}

              </div>

            </header>

            <div className="date-row">

              <div className="date">

                {range === "week" &&
                  "Sep 7 – Sep 13"
                }

                {range === "month" &&
                  "September 2026"
                }

                {range === "year" &&
                  "2026"
                }

              </div>

              <div className="arrow-buttons">
                <button className="arrow">‹</button>
                <button className="arrow">›</button>
              </div>

            </div>

            {range === "week" && <Week />}
            {range === "month" && <Month />}
            {range === "year" && <Year />}

          </main>
        );
      }

      ReactDOM
        .createRoot(document.getElementById("root"))
        .render(<App />);
    </script>
  </body>
</html>
